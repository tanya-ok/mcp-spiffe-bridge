server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "partner.example.net"
  data_dir = "/run/spire/data"
  log_level = "INFO"
  ca_ttl = "2h"
  default_x509_svid_ttl = "1m"

  federation {
    bundle_endpoint {
      address = "0.0.0.0"
      port = 8443
    }
    federates_with "example.org" {
      bundle_endpoint_url = "https://spire-server-a:8443"
      bundle_endpoint_profile "https_spiffe" {
        endpoint_spiffe_id = "spiffe://example.org/spire/server"
      }
    }
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "memory" {
    plugin_data {}
  }
  UpstreamAuthority "disk" {
    plugin_data {
      cert_file_path = "/run/spire/ca/ca.pem"
      key_file_path = "/run/spire/ca/ca.key"
    }
  }
}
