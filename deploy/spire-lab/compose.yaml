# Two federated SPIRE trust domains with one agent and one workload runner each.
# Started by bench.sh inside the bridge-fed-lab Lima VM; all material is synthetic.
name: bridge-fed-lab

x-server: &server
  image: ghcr.io/spiffe/spire-server:1.16.0@sha256:ff546f4c62dafc479a0cd79eae9a7b6df2975754d75efd31706098e0d7548837
  restart: "no"
x-agent: &agent
  image: ghcr.io/spiffe/spire-agent:1.16.0@sha256:ab3a8ce70435374cc5d84c81eabf0278dc046ddbc0a736d59694ba9e5975b1b6
  restart: "no"
x-runner: &runner
  image: bridge-fed-lab-runner:local
  build: ./runner
  command: ["sleep", "infinity"]
  init: true

services:
  spire-server-a:
    <<: *server
    command: ["-config", "/run/spire/config/server.conf"]
    volumes:
      - ./config/server-a.conf:/run/spire/config/server.conf:ro
      - ./work/ca-a:/run/spire/ca:ro
  spire-server-b:
    <<: *server
    command: ["-config", "/run/spire/config/server.conf"]
    volumes:
      - ./config/server-b.conf:/run/spire/config/server.conf:ro
      - ./work/ca-b:/run/spire/ca:ro

  runner-a:
    <<: *runner
    volumes:
      - sockets-a:/run/spire/sockets
      - ./work/out:/bench/out
  runner-b:
    <<: *runner
    volumes:
      - sockets-b:/run/spire/sockets
      - ./work/forged:/bench/forged:ro
      - ./work/out:/bench/out

  agent-a:
    <<: *agent
    pid: "service:runner-a"
    command: ["-config", "/run/spire/config/agent.conf", "-joinToken", "${JOIN_TOKEN_A:-unset}"]
    volumes:
      - ./config/agent-a.conf:/run/spire/config/agent.conf:ro
      - ./work/ca-a/ca.pem:/run/spire/ca/ca.pem:ro
      - sockets-a:/run/spire/sockets
      - agent-a-data:/run/spire/data
  agent-b:
    <<: *agent
    pid: "service:runner-b"
    command: ["-config", "/run/spire/config/agent.conf", "-joinToken", "${JOIN_TOKEN_B:-unset}"]
    volumes:
      - ./config/agent-b.conf:/run/spire/config/agent.conf:ro
      - ./work/ca-b/ca.pem:/run/spire/ca/ca.pem:ro
      - sockets-b:/run/spire/sockets
      - agent-b-data:/run/spire/data

volumes:
  sockets-a:
  sockets-b:
  agent-a-data:
  agent-b-data:
